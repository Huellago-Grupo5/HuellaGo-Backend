TR_PLANIFICAR_DESPLAZAMIENTOS.title=Check how to organize your errands
TR_PLANIFICAR_DESPLAZAMIENTOS.reason=You recorded {/transporte/medio}, {/transporte/kmSemana} km/week and {/transporte/diasSemana} days/week. We do not know your upcoming errands.
TR_PLANIFICAR_DESPLAZAMIENTOS.SIN_ENFOQUE=Write down your upcoming errands and check what needs each trip must meet before organizing it.
TR_PLANIFICAR_DESPLAZAMIENTOS.NECESIDAD=Write down your upcoming errands and check which require a trip and which might be handled another way, if you find a suitable option.
TR_PLANIFICAR_DESPLAZAMIENTOS.AGRUPACION=Write down your upcoming errands and check whether two could be completed on the same trip without compromising your needs.
TR_REVISAR_MOVILIDAD_ACTIVA.title=Organize your errands using your current mode of transport
TR_REVISAR_MOVILIDAD_ACTIVA.reason=You recorded {/transporte/medio}, {/transporte/kmSemana} km/week and {/transporte/diasSemana} days/week. We do not know your upcoming errands.
TR_REVISAR_MOVILIDAD_ACTIVA.SIN_ENFOQUE=Write down an upcoming errand and check what you need to do it using the mode of transport you already use, considering timing, what you carry, and safety.
TR_REVISAR_MOVILIDAD_ACTIVA.ORGANIZACION=Write down your upcoming errands and check which you could organize on the same trip using the mode of transport you already use.
TR_REVISAR_MOVILIDAD_ACTIVA.VIABILIDAD=Choose an upcoming errand and check whether its timing, what you carry, and other conditions allow you to do it using the mode of transport you already use.
EN_REVISAR_REGISTRO_HOGAR.title=Check your electricity record
EN_REVISAR_REGISTRO_HOGAR.reason=You recorded home type {/energia/vivienda}, {/energia/personas} people and {/energia/fuente}, with {/energia/consumoKwhDiario} kWh/day for the household. We do not know how that value was obtained, what measurement or estimate supports it, or its original period.
EN_REVISAR_REGISTRO_HOGAR.SIN_ENFOQUE=Check where your household electricity record came from and verify the period and scope of the original measurement or estimate.
EN_REVISAR_REGISTRO_HOGAR.ALCANCE=Check what period and what part of the household the original measurement or estimate covered when your household kWh/day value was obtained.
EN_REVISAR_REGISTRO_HOGAR.PROCEDENCIA_REGISTRO=Check where your electricity consumption value came from and note how it was calculated or measured, if you have that information.
AL_PLANIFICAR_APROVECHAMIENTO.title=Check what you have before shopping
AL_PLANIFICAR_APROVECHAMIENTO.reason=Your recorded diet is {/alimentacion/tipo}. We do not know what food you have available.
AL_PLANIFICAR_APROVECHAMIENTO.SIN_ENFOQUE=Check what food you have available before preparing your next shopping list, while respecting your diet.
AL_PLANIFICAR_APROVECHAMIENTO.PLANIFICACION=Before preparing your next shopping list, check what food you have available and consider what you can use while respecting your diet.
AL_PLANIFICAR_APROVECHAMIENTO.DISPONIBILIDAD=Write down the food you actually have available and check what you can use while respecting your diet.
RE_INICIAR_SEPARACION.title=Find out how to hand over separated materials
RE_INICIAR_SEPARACION.reason=Recycling record: {/residuos/reciclas}; plastic use: {/residuos/plasticos}. We do not know the waste management options in your area.
RE_INICIAR_SEPARACION.SIN_ENFOQUE=Look for information about ways to manage recyclables in your area and, if you find one, check which materials it accepts.
RE_INICIAR_SEPARACION.CONDICIONES_LOCALES=Look for information about a possible way to manage recyclables in your area. If one is available, check its acceptance conditions.
RE_INICIAR_SEPARACION.SEPARACION=If you find an available way to manage recyclables, check which materials it accepts and identify one you can separate according to its instructions.
RE_REVISAR_ENTREGA.title=Check the instructions for handing over materials
RE_REVISAR_ENTREGA.reason=You recorded that you recycle, and recorded plastic use: {/residuos/plasticos}. We do not know how you do it or the instructions of any handover option.
RE_REVISAR_ENTREGA.SIN_ENFOQUE=Check whether your recycling involves handing over materials. If so, check which materials that option accepts and its conditions before preparing a handover.
RE_REVISAR_ENTREGA.MATERIALES_ADMITIDOS=If you use a handover option, check which materials it accepts before preparing your next handover.
RE_REVISAR_ENTREGA.CONDICIONES_ENTREGA=If you hand materials over to a person, organization, or service, check its instructions for preparing and handing them over.
TR_EXPLORAR_ALTERNATIVAS_AUTO.title=Check alternatives for an errand
TR_EXPLORAR_ALTERNATIVAS_AUTO.reason=You recorded {/transporte/medio}, {/transporte/kmSemana} km/week and {/transporte/diasSemana} days/week. We do not know which alternatives are available for your trips.
TR_EXPLORAR_ALTERNATIVAS_AUTO.SIN_ENFOQUE=Choose an upcoming errand and find out whether another way of making that trip would suit your needs.
TR_EXPLORAR_ALTERNATIVAS_AUTO.DISPONIBILIDAD=Choose an upcoming errand and look for information about available travel alternatives for it, if any.
TR_EXPLORAR_ALTERNATIVAS_AUTO.VIABILIDAD=If you identify an alternative for an upcoming errand, check whether its safety, accessibility, and conditions allow you to use it without compromising your needs.
EN_REVISAR_USOS.title=Identify uses of your energy source
EN_REVISAR_USOS.reason=You recorded home type {/energia/vivienda}, {/energia/personas} people and {/energia/fuente} as the energy source. We do not know the specific uses of that source in your household.
EN_REVISAR_USOS.SIN_ENFOQUE=Write down an actual use of the recorded source ({/energia/fuente}) in your household and check what need it meets before considering a change.
EN_REVISAR_USOS.IDENTIFICAR_USOS=Write down the household activities that use the recorded source ({/energia/fuente}) and choose one to describe how you use it.
EN_REVISAR_USOS.COMPROBAR_NECESIDAD=Choose an actual use of the recorded source ({/energia/fuente}) and check what need it meets. Consider an adjustment only if it preserves safety, well-being, and essential needs.
AL_REVISAR_PRESENTACION.title=Check the available forms of a food item
AL_REVISAR_PRESENTACION.reason=Your recorded diet is {/alimentacion/tipo}. We do not know which foods you are considering or what forms are available.
AL_REVISAR_PRESENTACION.SIN_ENFOQUE=For a food item you are considering that suits your diet, check what forms are available and what their packaging is like, if you find options.
AL_REVISAR_PRESENTACION.PRESENTACION=If you find different forms of a food item you are considering, compare their packaging and the quantity you need, while respecting your diet.
AL_REVISAR_PRESENTACION.DISPONIBILIDAD=For a food item you are considering, find out whether other available forms suit your needs and your diet.
RE_REVISAR_REUTILIZACION.title=Check a use of disposable plastic
RE_REVISAR_REUTILIZACION.reason=Recycling record: {/residuos/reciclas}; plastic use: {/residuos/plasticos}. We do not know which items you use or what alternatives are available.
RE_REVISAR_REUTILIZACION.SIN_ENFOQUE=Check whether any of your plastic uses involves a disposable item. If you identify one, check whether it can be avoided or whether you can find a reusable alternative intended for that use that can be used and cleaned safely, without needing to buy it. If you cannot verify its suitability, hygiene, or safety, do not reuse it for that purpose.
RE_REVISAR_REUTILIZACION.NECESIDAD=Check whether any of your plastic uses involves a disposable item. If you identify one, check what need it meets and consider avoiding it only if that need can still be met without compromising safety or essential needs.
RE_REVISAR_REUTILIZACION.REUTILIZACION_VIABLE=If you find a reusable alternative for an actual use of disposable plastic, check that it is intended for that use and can be used and cleaned safely. If you cannot verify this, do not reuse it for that purpose.
