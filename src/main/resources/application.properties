spring.application.name=HuellaGo-Backend
server.port=8081
server.address=127.0.0.1
server.forward-headers-strategy=none

# Base de datos
spring.datasource.url=${HUELLAGO_DB_URL:jdbc:postgresql://localhost:5432/huellagodb}
spring.datasource.username=${HUELLAGO_DB_USERNAME:huellago_local}
spring.datasource.password=${HUELLAGO_DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# La inicialización propia interpreta bloques DO de PostgreSQL y corre después de Hibernate.
spring.sql.init.mode=never

# Seguridad
huellago.jwt.secret=${HUELLAGO_JWT_SECRET:}
huellago.cors.allowed-origins=${HUELLAGO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}

# Swagger
springdoc.api-docs.enabled=${HUELLAGO_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${HUELLAGO_SWAGGER_ENABLED:true}

# Servicios ambientales
huellago.ambiente.open-meteo.enabled=${HUELLAGO_OPEN_METEO_ENABLED:true}
huellago.ambiente.open-meteo.url=${HUELLAGO_OPEN_METEO_URL:https://air-quality-api.open-meteo.com/v1/air-quality}

huellago.ambiente.geoapify.enabled=${HUELLAGO_GEOAPIFY_ENABLED:false}
huellago.ambiente.geoapify.api-key=${HUELLAGO_GEOAPIFY_API_KEY:}
huellago.ambiente.geoapify.url=https://api.geoapify.com/v2/places
huellago.ambiente.geoapify.daily-limit=${HUELLAGO_GEOAPIFY_DAILY_LIMIT:1000}
huellago.ambiente.geoapify.read-timeout-seconds=${HUELLAGO_GEOAPIFY_READ_TIMEOUT_SECONDS:8}

huellago.ambiente.connect-timeout-seconds=${HUELLAGO_AMBIENTE_CONNECT_TIMEOUT_SECONDS:3}
huellago.ambiente.read-timeout-seconds=${HUELLAGO_AMBIENTE_READ_TIMEOUT_SECONDS:8}

# Inteligencia artificial
huellago.ollama.enabled=true
huellago.ollama.base-url=http://localhost:11434
huellago.ollama.model=qwen3:4b-instruct

# Medicion de carbono
huellago.medicion.electricidad.factor-kg-co2e-kwh=0.23825
huellago.medicion.electricidad.referencia=Convencion universitaria local HuellaGo aprobada por el responsable; factor provisional no oficial

# Correo
spring.mail.properties[mail.smtp.auth]=${HUELLAGO_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${HUELLAGO_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties[mail.smtp.starttls.required]=${HUELLAGO_SMTP_STARTTLS_REQUIRED:true}
