services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: huellagodb_hu29_test
      POSTGRES_USER: ${HUELLAGO_DB_USERNAME:-huellago_local}
      POSTGRES_PASSWORD: ${HUELLAGO_DB_PASSWORD:?Define HUELLAGO_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${HUELLAGO_COMPOSE_PG_PORT:-55432}:5432"
    volumes:
      - huellago_postgres_18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ia"]
    ports:
      - "127.0.0.1:${HUELLAGO_COMPOSE_OLLAMA_PORT:-11435}:11434"
    volumes:
      - huellago_ollama_models:/root/.ollama

volumes:
  huellago_postgres_18:
  huellago_ollama_models:
